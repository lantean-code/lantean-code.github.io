<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     role="img"
     aria-labelledby="title description"
     color="#F5F7FA">
  <title id="title">Lantean Code mark</title>
  <desc id="description">A segmented hexagonal aperture surrounding a pair of code angle brackets.</desc>

  <!--
    Monochrome geometric master. It renders Soft White by default and inherits
    currentColor, so an inline consumer can override the `color` property.
  -->
  <defs>
    <!--
      Upper-left aperture segment reconstructed from the approved Signal
      Aperture silhouette. All other diagonal segments are exact mirrors.
    -->
    <path id="aperture-diagonal"
          d="M 240 57 L 240 139 L 224 139 L 224 108.0267
             L 120 171.92 L 84 152.84 Z" />
  </defs>

  <g fill="currentColor">
    <!-- Four mirrored diagonal segments. -->
    <use href="#aperture-diagonal" />
    <use href="#aperture-diagonal" transform="translate(512 0) scale(-1 1)" />
    <use href="#aperture-diagonal" transform="translate(0 512) scale(1 -1)" />
    <use href="#aperture-diagonal" transform="translate(512 512) scale(-1 -1)" />

    <!-- Tapered side segments, mirrored about the vertical axis. -->
    <path id="aperture-side"
          d="M 80 174.72 L 120 195.92 L 120 316.08 L 80 337.28 Z" />
    <use href="#aperture-side" transform="translate(512 0) scale(-1 1)" />

    <!-- Code bracket silhouette, mirrored about the vertical axis. -->
    <path id="code-bracket"
          d="M 224 194 L 224 224 L 188 256 L 224 288
             L 224 318 L 152 256 Z" />
    <use href="#code-bracket" transform="translate(512 0) scale(-1 1)" />
  </g>
</svg>
